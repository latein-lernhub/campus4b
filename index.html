<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus 4B Lernhub</title>
<style>
:root {
  --bg: #F0EDE8;
  --surface: #FFFFFF;
  --surface2: #F8F6F3;
  --border: #DDD8D0;
  --border2: #E8E4DD;
  --text: #1C1917;
  --text2: #44403C;
  --muted: #78716C;
  --accent: #1E4A7A;
  --accent2: #2563A8;
  --accent-lt: #EBF2FB;
  --accent-glow: rgba(30,74,122,0.12);
  --correct: #166534;
  --correct-lt: #DCFCE7;
  --correct-border: #86EFAC;
  --wrong: #991B1B;
  --wrong-lt: #FEE2E2;
  --wrong-border: #FCA5A5;
  --latin: #92400E;
  --latin-lt: #FEF3C7;
  --latin-border: #FCD34D;
  --gold: #B45309;
  --r: 14px;
  --r-sm: 8px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.05);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.1), 0 4px 10px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141210;
    --surface: #1E1B18;
    --surface2: #252118;
    --border: #3A352E;
    --border2: #2E2A24;
    --text: #F5F0EB;
    --text2: #C7BFB6;
    --muted: #8C8078;
    --accent: #4A90D9;
    --accent2: #6BAEE8;
    --accent-lt: #162233;
    --accent-glow: rgba(74,144,217,0.15);
    --correct: #4ADE80;
    --correct-lt: #052E16;
    --correct-border: #166534;
    --wrong: #F87171;
    --wrong-lt: #2A0A0A;
    --wrong-border: #7F1D1D;
    --latin: #FCD34D;
    --latin-lt: #1C1400;
    --latin-border: #92400E;
    --gold: #FCD34D;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
    --shadow: 0 4px 12px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.4);
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ── HEADER ── */
header {
  background: var(--accent);
  background: linear-gradient(135deg, #1A3F6E 0%, #2563A8 100%);
  color: #fff;
  padding: 18px 22px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.2);
  position: sticky;
  top: 0;
  z-index: 100;
}
header .logo {
  width: 36px; height: 36px;
  background: rgba(255,255,255,.15);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
header h1 {
  font-family: Georgia, serif;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: .01em;
}
header span {
  font-size: .78rem;
  opacity: .65;
  margin-left: 2px;
}

/* ── BREADCRUMB ── */
#bc {
  padding: 10px 20px;
  font-size: .75rem;
  color: var(--muted);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  min-height: 38px;
  overflow-x: auto;
}
.bcitem {
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color .15s, background .15s;
  white-space: nowrap;
}
.bcitem:hover { color: var(--accent); background: var(--accent-lt); }
.sep { color: var(--border); font-size: .9rem; }

/* ── MAIN ── */
main { max-width: 800px; margin: 0 auto; padding: 28px 16px 80px; }

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; animation: fadeUp .2s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── PAGE TITLES ── */
.ptitle {
  font-family: Georgia, serif;
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 4px;
  color: var(--text);
}
.psub { color: var(--muted); font-size: .84rem; margin-bottom: 24px; line-height: 1.5; }

/* ── BACK BUTTON ── */
.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 50px;
  padding: 7px 16px 7px 12px;
  font-size: .82rem;
  color: var(--text2);
  cursor: pointer;
  margin-bottom: 22px;
  transition: all .18s;
  box-shadow: var(--shadow-sm);
}
.back::before { content: "←"; font-size: .9rem; }
.back:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-lt);
  box-shadow: 0 0 0 3px var(--accent-glow);
  transform: translateX(-2px);
}
.back:active { transform: translateX(0) scale(.97); }

/* ── GRIDS ── */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 520px) { .grid4 { grid-template-columns: repeat(4, 1fr); } }

/* ── STANDARD CARD ── */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border2);
  border-radius: var(--r);
  padding: 20px 18px;
  cursor: pointer;
  transition: all .2s;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--r);
  background: var(--accent-glow);
  opacity: 0;
  transition: opacity .2s;
}
.card:hover { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 3px var(--accent-glow); transform: translateY(-2px); }
.card:hover::after { opacity: 1; }
.card:active { transform: translateY(0) scale(.97); box-shadow: var(--shadow-sm); }
.card .ci { font-size: 1.6rem; margin-bottom: 10px; display: block; }
.card .ct { font-weight: 700; font-size: .95rem; margin-bottom: 4px; color: var(--text); }
.card .cd { font-size: .77rem; color: var(--muted); line-height: 1.45; }

/* ── MODE CARDS (Lernen / Quiz) ── */
.modecard {
  background: var(--surface);
  border: 2px solid var(--border2);
  border-radius: var(--r);
  padding: 28px 20px;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.modecard:hover {
  border-color: var(--accent);
  background: var(--accent-lt);
  box-shadow: var(--shadow), 0 0 0 3px var(--accent-glow);
  transform: translateY(-3px);
}
.modecard:active { transform: scale(.97); }
.modecard .mi { font-size: 2.4rem; margin-bottom: 12px; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.1)); }
.modecard .ml { font-weight: 700; font-size: 1.05rem; color: var(--text); }
.modecard .mh { font-size: .78rem; color: var(--muted); margin-top: 5px; line-height: 1.4; }

/* ── KAPITEL CARDS (95, 96, 97, 98) ── */
.kapcard {
  background: var(--surface);
  border: 1.5px solid var(--border2);
  border-radius: var(--r);
  padding: 20px 14px;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
  box-shadow: var(--shadow-sm);
}
.kapcard:hover {
  border-color: var(--accent);
  background: var(--accent-lt);
  box-shadow: var(--shadow), 0 0 0 3px var(--accent-glow);
  transform: translateY(-2px);
}
.kapcard:active { transform: scale(.97); }
.kapcard .kn {
  font-family: Georgia, serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}
.kapcard .kl { font-size: .73rem; color: var(--muted); }

/* ── VOKABEL AUFDECKEN ── */
.vok-hint {
  font-size: .78rem;
  color: var(--muted);
  margin-bottom: 12px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.vok-hint::before, .vok-hint::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.vok-grid {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.vok-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.vh {
  background: var(--latin-lt);
  color: var(--latin);
  font-weight: 700;
  font-size: .75rem;
  padding: 9px 14px;
  border-bottom: 2px solid var(--latin-border);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.vh:first-child { border-right: 1px solid var(--latin-border); }
.vok-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid var(--border2);
  transition: background .15s;
}
.vok-row:last-child { border-bottom: none; }
.vok-row:hover { background: var(--surface2); }
.vok-lat {
  padding: 11px 14px;
  border-right: 1px solid var(--border2);
  font-family: Georgia, serif;
  font-style: italic;
  font-size: .91rem;
  color: var(--latin);
  display: flex;
  align-items: center;
  line-height: 1.4;
}
.vok-de {
  padding: 11px 14px;
  display: flex;
  align-items: center;
  cursor: pointer;
  user-select: none;
  min-height: 44px;
  gap: 8px;
  position: relative;
}
.vok-de .hde {
  filter: blur(6px);
  transition: filter .25s ease;
  font-size: .87rem;
  flex: 1;
  color: var(--text);
  line-height: 1.4;
}
.vok-de.rev .hde { filter: none; }
.vok-de .taphi {
  font-size: .65rem;
  color: var(--muted);
  opacity: .5;
  white-space: nowrap;
  transition: opacity .2s;
  flex-shrink: 0;
}
.vok-de.rev .taphi { opacity: 0; }
.vok-de:active { background: var(--accent-lt); }

/* ── LERN-INHALT BLOCKS ── */
.lblock {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 22px 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.lblock h3 {
  font-family: Georgia, serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--latin);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--latin-border);
}
.lblock p { font-size: .88rem; line-height: 1.8; margin-bottom: 12px; color: var(--text2); }
.lblock p:last-child { margin-bottom: 0; }
.lblock strong { color: var(--text); font-weight: 700; }

/* ── GRAMMATIK TABELLE ── */
.gtable { width: 100%; border-collapse: collapse; font-size: .83rem; margin: 10px 0; border-radius: var(--r-sm); overflow: hidden; }
.gtable th {
  background: var(--accent-lt);
  color: var(--accent);
  font-weight: 700;
  padding: 8px 10px;
  border: 1px solid var(--border);
  text-align: center;
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.gtable td { padding: 8px 10px; border: 1px solid var(--border2); text-align: center; color: var(--text2); }
.gtable .rh { font-weight: 600; background: var(--surface2); text-align: left; color: var(--text); }
.gtable .lat { font-family: Georgia, serif; font-style: italic; color: var(--latin); }
.gtable .hi { color: var(--wrong); font-weight: 800; font-style: normal; }
.note {
  background: var(--accent-lt);
  border-left: 3px solid var(--accent);
  padding: 11px 16px;
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: .82rem;
  margin: 12px 0;
  line-height: 1.65;
  color: var(--text2);
}
.sechead {
  font-weight: 700;
  font-size: .8rem;
  color: var(--muted);
  margin: 18px 0 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: .05em;
}

/* ── QUIZ FORTSCHRITT ── */
.qprog-wrap { margin-bottom: 18px; }
.qprog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.qprog-txt { font-size: .78rem; color: var(--muted); font-weight: 600; }
.qprog-pct { font-size: .78rem; color: var(--accent); font-weight: 700; }
.qbar {
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.qfill {
  height: 6px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
  border-radius: 99px;
  transition: width .4s ease;
}

/* ── QUIZ FRAGE ── */
.qbox {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 20px 22px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.qlbl {
  font-size: .7rem;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 8px;
}
.qtxt {
  font-family: Georgia, serif;
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--text);
}

/* ── QUIZ OPTIONEN ── */
.qopts { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }
.qopt {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  padding: 13px 16px;
  cursor: pointer;
  font-size: .89rem;
  text-align: left;
  width: 100%;
  transition: all .15s;
  color: var(--text);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
}
.qopt::before {
  content: '';
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-radius: 50%;
  flex-shrink: 0;
  transition: all .15s;
}
.qopt:hover:not([disabled]) {
  border-color: var(--accent);
  background: var(--accent-lt);
  box-shadow: 0 0 0 3px var(--accent-glow);
  transform: translateX(3px);
}
.qopt:hover:not([disabled])::before { border-color: var(--accent); background: var(--accent-lt); }
.qopt:active:not([disabled]) { transform: translateX(1px) scale(.99); }
.qopt.correct {
  border-color: var(--correct-border) !important;
  background: var(--correct-lt) !important;
  color: var(--correct) !important;
  font-weight: 600;
  box-shadow: 0 0 0 3px rgba(134,239,172,.2) !important;
}
.qopt.correct::before { border-color: var(--correct) !important; background: var(--correct) !important; }
.qopt.wrong {
  border-color: var(--wrong-border) !important;
  background: var(--wrong-lt) !important;
  color: var(--wrong) !important;
  box-shadow: 0 0 0 3px rgba(252,165,165,.2) !important;
}
.qopt.wrong::before { border-color: var(--wrong) !important; }
.qopt[disabled] { cursor: default; }

/* ── JA / NEIN ── */
.jn-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.jnbtn {
  border: 2px solid var(--border);
  border-radius: var(--r);
  padding: 20px 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  background: var(--surface);
  color: var(--text);
  transition: all .18s;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.jnbtn .jicon { font-size: 1.6rem; }
.jnbtn:hover:not([disabled]) {
  border-color: var(--accent);
  background: var(--accent-lt);
  box-shadow: var(--shadow), 0 0 0 3px var(--accent-glow);
  transform: translateY(-2px);
}
.jnbtn:active:not([disabled]) { transform: scale(.96); }
.jnbtn[disabled] { cursor: default; }
.jnbtn.correct { border-color: var(--correct-border) !important; background: var(--correct-lt) !important; color: var(--correct) !important; }
.jnbtn.wrong   { border-color: var(--wrong-border) !important;   background: var(--wrong-lt) !important;   color: var(--wrong) !important; }

/* ── FEEDBACK ── */
.qfb {
  padding: 11px 16px;
  border-radius: var(--r-sm);
  font-size: .84rem;
  margin-bottom: 12px;
  display: none;
  line-height: 1.55;
  font-weight: 500;
}
.qfb.show { display: block; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.qfb.ok { background: var(--correct-lt); color: var(--correct); border: 1px solid var(--correct-border); }
.qfb.err { background: var(--wrong-lt); color: var(--wrong); border: 1px solid var(--wrong-border); }

/* ── NÄCHSTE FRAGE BUTTON ── */
.qnext {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 12px 28px;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  display: none;
  box-shadow: var(--shadow);
  transition: all .18s;
  letter-spacing: .02em;
}
.qnext.show { display: inline-flex; align-items: center; gap: 6px; animation: fadeIn .2s ease; }
.qnext::after { content: "→"; font-size: 1rem; }
.qnext:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); opacity: .95; }
.qnext:active { transform: scale(.97); }

/* ── ERGEBNIS ── */
.result-box {
  text-align: center;
  padding: 40px 20px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  animation: fadeUp .3s ease;
}
.result-trophy { font-size: 3rem; margin-bottom: 12px; display: block; }
.result-score {
  font-family: Georgia, serif;
  font-size: 3.2rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
  line-height: 1;
}
.result-sub { font-size: .86rem; color: var(--muted); margin-bottom: 10px; }
.result-msg {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 24px;
  padding: 10px 20px;
  background: var(--accent-lt);
  border-radius: 50px;
  display: inline-block;
}
.result-retry {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 12px 32px;
  font-size: .92rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all .18s;
  letter-spacing: .02em;
}
.result-retry:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.result-retry:active { transform: scale(.97); }

/* ── PLACEHOLDER ── */
.ph {
  text-align: center;
  padding: 52px 20px;
  color: var(--muted);
  border: 2px dashed var(--border);
  border-radius: var(--r);
  background: var(--surface2);
}
.phi { font-size: 2.4rem; margin-bottom: 12px; }
.ph p { font-size: .88rem; line-height: 1.7; }
</style>
</head>
<body>

<header>
  <div class="logo">📜</div>
  <div>
    <h1>Campus 4B</h1>
    <span>Latein Lernhub</span>
  </div>
</header>

<div id="bc"></div>

<main>
  <div id="v-home" class="view active">
    <div class="ptitle">Schulaufgaben</div>
    <div class="psub">Wähle eine Schulaufgabe, um zu beginnen.</div>
    <div class="grid2" id="sa-grid"></div>
  </div>

  <div id="v-modus" class="view">
    <button class="back" id="back-modus">Startseite</button>
    <div class="ptitle" id="modus-title"></div>
    <div class="psub">Was möchtest du tun?</div>
    <div class="grid2">
      <div class="modecard" onclick="goBereich('lernen')">
        <span class="mi">📖</span>
        <div class="ml">Lernen</div>
        <div class="mh">Inhalte lesen und aufdecken</div>
      </div>
      <div class="modecard" onclick="goBereich('quiz')">
        <span class="mi">✏️</span>
        <div class="ml">Quiz</div>
        <div class="mh">Wissen testen</div>
      </div>
    </div>
  </div>

  <div id="v-bereich" class="view">
    <button class="back" id="back-bereich">zurück</button>
    <div class="ptitle" id="bereich-title"></div>
    <div class="psub" id="bereich-sub"></div>
    <div class="grid4" id="bereich-grid"></div>
  </div>

  <div id="v-kapitel" class="view">
    <button class="back" id="back-kapitel">zurück</button>
    <div class="ptitle" id="kapitel-title"></div>
    <div class="psub" id="kapitel-sub"></div>

function renderITextLearn(id,body){
  var blocks={
    'griech-phil':'<div class="lblock"><h3>Griechische Philosophen</h3><p>Die Philosophie begann im 6. Jh. v.Chr. mit den so genannten <strong>Vorsokratikern</strong>, also den Philosophen, die vor Sokrates lebten. Sie beschäftigten sich vor allem mit der Frage nach dem Ursprung aller Dinge und versuchten, die Erscheinungen der Natur nicht mehr mythisch, sondern wissenschaftlich zu erklaeren.</p><p><strong>Sokrates</strong> (469-399 v.Chr.) verfasste selbst keine Schriften. Was man über ihn weiß, überlieferte vor allem sein Schüler Platon. In der sokratischen Philosophie stand nicht mehr die Natur im Mittelpunkt, sondern der Mensch und die Frage, wie man richtig lebt. Seine Hinwendung zur Ethik bezeichnet man als die "Sokratische Wende". <strong>Platon</strong> (427-347 v.Chr.) gründete in Athen eine Schule, die berühmte Akademie. Sein Schüler <strong>Aristoteles</strong> (384-322 v.Chr.) schuf nach Jahren als Erzieher Alexanders des Großen seine eigene Schule, den Peripatos.</p><p>Bald entstanden weitere Philosophenschulen: Der <strong>Kepos</strong>, die Schule Epikurs (341-270 v.Chr.), sah das Glück in der Lust (voluptas). Darunter verstanden die Epikureer aber nicht ein Leben im Luxus, sondern die Freiheit von Schmerz und Ängsten (z.B. Todesfurcht). Zur Erreichung dieses Ziels empfahlen sie, sich aus dem Leben der Gesellschaft zurückzuziehen und mit wenigen Gleichgesinnten bescheiden zu leben; daher hatte die Freundschaft (amicitia) bei den Epikureern einen hohen Stellenwert.</p><p>Die <strong>Stoa</strong> würde von Zenon von Kition (333-261 v.Chr.) gegründet. Sie sah es als Lebensziel an, ein Leben gemäßß der Vernunft (ratio) zu führen, trotz aller Herausforderungen des Schicksals ausgeglichen zu bleiben und Schicksalsschläge anzunehmen. Die sog. stoische Ruhe würde Kennzeichen der Weisen. Im Gegensatz zu den Epikureern fordert die Stoa eine aktive Betätigung in der Gesellschaft, da der Mensch nur so zu vollendeter Tugend (virtus) gelängen koenne.</p></div>',
    'cicero-seneca':'<div class="lblock"><h3>Cicero und Seneca als bedeutende Vermittler griechischen Gedankenguts</h3><p>Es war die große Leistung des römischen Staatsmannes und Schriftstellers <strong>Cicero</strong> (106-43 v.Chr.), die Lehren der griechischen Philosophenschulen einer breiten Öffentlichkeit in Rom zugänglich zu machen, indem er eine philosophische Begrifflichkeit in lateinischer Sprache prägte. Er vermittelte in seinen Schriften nicht nur die griechischen Vorstellungen, sondern passte diese auch an die römischen Verhältnisse an.</p><p><strong>Seneca</strong> (4 n.Chr.-65 n.Chr.), römischer Schriftsteller, stoischer Philosoph und Erzieher des Kaisers Nero, verfasste zahlreiche philosophische Schriften, in denen er seinen Landsleuten die Lehre der Stoa vermittelte - nicht theoretisierend, sondern praxisnah durch konkrete Beispiele. Aus diesem Grund war für Seneca Sokrates vorbildhaft. Die philosophische Gesprächsführung und Argumentationstechnik des Sokrates faszinierte Seneca, der praktische Tipps für konkrete Lebensfragen geben wollte. Die oft spitzfindigen und schwer verständlichen philosophischen Theorien anderer Griechen hielt er aber für wenig hilfreich.</p><p><strong>Cicero</strong> hingegen orientierte sich inhaltlich wie auch in der literarischen Gestaltung erkennbar an den griechischen Vorlagen, insbesondere an Platon und Aristoteles. Häufig stellte er stoisches und epikureisches Gedankengut gegeneinander. Die entscheidende Figur bei der Entwicklung der antiken Philosophie war aber auch für Cicero Sokrates. Dieser hat nämlich - so formuliert es Cicero - als Erster die Philosophie vom Himmel heruntergerufen....</p></div>',
    'thales':'<div class="lblock"><h3>Thales - ein Naturwissenschaftler</h3><p>Die Dichter der Mythen hatten sich die Entstehung der Welt als ein einmaliges Ereignis vorgestellt. <strong>Thales von Milet</strong> (624-546 v.Chr.) glaübte dagegen, dass alles einen gemeinsamen, unvergänglichen Urstoff haben muss, der alle Dinge hervorbringt und wieder in sich zurücknimmt. Für ihn war das <strong>Wasser</strong> dieser Urstoff. Wahrscheinlich würde er durch genaue Beobachtung des Meeres, das seine ionische Heimatstadt Milet umspülte, zu dieser These gefuehrt.</p></div>',
    'xenophanes':'<div class="lblock"><h3>Xenophanes - ein antiker Querdenker</h3><p><strong>Xenophanes</strong> (570-475 v.Chr.) machte sich über die Göttervorstellung des Mythos und der Dichtung lustig, wonach die Götter den Menschen ähnlich seien. Geistreich zugespitzt meinte er, dass nicht die Götter die Menschen, sondern die Menschen sich ihre Götter erschaffen. Dies erlaeuterte er mit seiner berühmten Sentenz: "Wenn die Pferde Götter hätten, sähen sie wie Pferde aus." Zudem war er der Ansicht, dass alle Dinge der Welt aus Wasser und Erde entstanden seien. Xenophanes gilt als Vorläufer des modernen kritisch-rationalen Denkens.</p></div>'
  };
  body.innerHTML = blocks[id] || '<div class="ph"><div class="phi">📬</div><p>Inhalt kommt bald.</p></div>';
}

function renderGrammatikLearn(id,body){
  if(id==='quisque'){
    body.innerHTML='<div class="lblock"><h3>Indefinitpronomen quisque, quidque – "jeder, jedes"</h3>'+
    '<p><strong>quisque, quidque</strong> = jeder, jedes (substantivisch)</p>'+
    '<table class="gtable"><tr><th>Kasus</th><th>m/f</th><th>n</th></tr>'+
    '<tr><td class="rh">Nominativ</td><td class="lat"><span class="hi">quis</span>que</td><td class="lat"><span class="hi">quid</span>que</td></tr>'+
    '<tr><td class="rh">Genitiv</td><td class="lat"><span class="hi">cuius</span>que</td><td class="lat"><span class="hi">cuius</span>que</td></tr>'+
    '<tr><td class="rh">Dativ</td><td class="lat"><span class="hi">cui</span>que</td><td class="lat"><span class="hi">cui</span>que</td></tr>'+
    '<tr><td class="rh">Akkusativ</td><td class="lat"><span class="hi">quem</span>que</td><td class="lat"><span class="hi">quid</span>que</td></tr>'+
    '<tr><td class="rh">Ablativ</td><td class="lat"><span class="hi">quo&#772;</span>que</td><td class="lat"><span class="hi">quo&#772;</span>que</td></tr>'+
    '</table>'+
    '<div class="note">Das substantivische Indefinitpronomen <em>quis-que, quid-que</em> wird dekliniert wie das Indefinitpronomen <em>ali-quis, ali-quid</em>. Die adjektivische Verwendung (<em>quisque, quaeque, quodque</em>) ist selten.</div>'+
    '<div class="note">Das Indefinitpronomen <em>quisque</em> steht in der Regel hinter Pronomina, Superlativen und Ordnungszahlen. Beispiel: <em>optimus quisque</em> = gerade die Besten.</div></div>';

    '<div class="sechead">Akkusativ mit Infinitiv (AcI)</div>'+

    '<div class="sechead">Participium coniunctum</div>'+
    '<table class="gtable"><tr><th></th><th>gleichzeitig</th><th>vorzeitig</th><th>nachzeitig</th></tr>'+
    '<tr><td class="rh">Aktiv (Plinius liest)</td><td class="lat">legens</td><td class="lat">–</td><td class="lat">lecturus</td></tr>'+
    '<tr><td class="rh">Passiv (Buch gelesen)</td><td class="lat">–</td><td class="lat">lectus</td><td class="lat">–</td></tr></table>'+

    '<table class="gtable"><tr><th></th><th>gleichzeitig</th><th>vorzeitig</th><th>nachzeitig</th></tr>'+
    '<tr><td class="rh">Ablativus abs.</td><td class="lat">legente</td><td class="lat">lecto</td><td class="lat">–</td></tr>'+
    '<tr><td class="rh">Bedeutung</td><td>während ... liest</td><td>nachdem ... gelesen</td><td>–</td></tr></table>'+

    '<div class="sechead">Personalendungen (Präsensstamm)</div>'+

function makeVokQuiz(kapId){
  var items=VOK_DATEN[kapId];
  var f=[];
  for(var i=0;i<items.length;i++){
    var richtig=items[i][1];
    var alle=[];
    for(var k in VOK_DATEN){
      for(var j=0;j<VOK_DATEN[k].length;j++){
        if(VOK_DATEN[k][j][1]!==richtig) alle.push(VOK_DATEN[k][j][1]);
      }
    }
    shuffle(alle);
    var opts=[richtig,alle[0],alle[1],alle[2],alle[3]];
    shuffle(opts);
    var ci=0;
    for(var x=0;x<opts.length;x++){if(opts[x]===richtig){ci=x;break;}}
    f.push({q:items[i][0],opts:opts,c:ci});
  }
  shuffle(f);
  return {typ:'mc',fragen:f};
}

function renderQuizEngine(body,daten,retryFn){
  if(!daten||daten.fragen.length===0){
    body.innerHTML='<div class="ph"><div class="phi">📬</div><p>Noch keine Quizfragen vorhänden.</p></div>';
    return;
  }
  if(daten.typ==='jaNein'){
    renderJaNeinQuiz(body,daten.fragen,retryFn);
  } else {
    renderMCQuiz(body,daten.fragen,retryFn);
  }
}

function renderMCQuiz(body,fragen,retryFn){
  var cur=0,richtig=0;
  function zeige(){
    if(cur>=fragen.length){ergebnis();return;}
    var f=fragen[cur];
    var pct=Math.round((cur/fragen.length)*100);
    var h='<div class="qprog-wrap"><div class="qprog-top"><span class="qprog-txt">Frage '+(cur+1)+' von '+fragen.length+'</span><span class="qprog-pct">'+pct+'%</span></div>'+
      '<div class="qbar"><div class="qfill" style="width:'+pct+'%"></div></div></div>';
    h+='<div class="qbox"><div class="qlbl">Frage '+(cur+1)+'</div><div class="qtxt">'+f.q+'</div></div>';
    h+='<div class="qopts">';
    for(var i=0;i<f.opts.length;i++){
      h+='<button class="qopt" id="o'+i+'" onclick="QA(this,'+i+','+f.c+',\''+esc(f.e||'')+'\')">'+(f.opts[i])+'</button>';
    }
    h+='</div><div class="qfb" id="qfb"></div>';
    h+='<button class="qnext" id="qnext" onclick="QN()">Nächste Frage</button>';
    body.innerHTML=h;
  }
  window.QA=function(btn,gew,cor,expl){
    var opts=document.querySelectorAll('.qopt');
    for(var i=0;i<opts.length;i++) opts[i].setAttribute('disabled','true');
    opts[cor].classList.add('correct');
    if(gew===cor) richtig++; else btn.classList.add('wrong');
    var fb=document.getElementById('qfb');
    fb.textContent=(gew===cor?'Richtig! ':'Falsch. ')+expl;
    fb.className='qfb show '+(gew===cor?'ok':'err');
    document.getElementById('qnext').className='qnext show';
  };
  window.QN=function(){cur++;zeige();};
  function ergebnis(){
    var pct=Math.round((richtig/fragen.length)*100);
    var msg=pct===100?'Perfekt! Alle richtig!':pct>=80?'Sehr gut!':pct>=60?'Gut gemacht!':pct>=40?'Weiter üben!':'Nochmal von vorne!';
    body.innerHTML='<div class="result-box"><span class="result-trophy">'+(pct===100?'🏆':pct>=80?'⭐':'📚')+'</span><div class="result-score">'+richtig+' / '+fragen.length+'</div>'+
      '<div class="result-sub">richtig beantwortet</div><div class="result-msg">'+msg+' ('+pct+'%)</div>'+
      '<button class="result-retry" onclick="('+retryFn+')()">Nochmal versuchen</button></div>';
  }
  zeige();
}

function renderJaNeinQuiz(body,fragen,retryFn){
  var cur=0,richtig=0;
  function zeige(){
    if(cur>=fragen.length){ergebnis();return;}
    var f=fragen[cur];
    var pct=Math.round((cur/fragen.length)*100);
    var h='<div class="qprog-wrap"><div class="qprog-top"><span class="qprog-txt">Frage '+(cur+1)+' von '+fragen.length+'</span><span class="qprog-pct">'+pct+'%</span></div>'+
      '<div class="qbar"><div class="qfill" style="width:'+pct+'%"></div></div></div>';
    h+='<div class="qbox"><div class="qlbl">Deponens?</div><div class="qtxt" style="font-style:italic">'+f.verb+'</div></div>';
    h+='<p style="font-size:.85rem;color:var(--muted);margin-bottom:10px">Ist dieses Wort ein Deponens?</p>';
    h+='<div class="jn-wrap">'+
      '<button class="jnbtn" id="jja" onclick="JNA(true,'+f.istDep+')"><span class="jicon">✅</span>Ja</button>'+
      '<button class="jnbtn" id="jnein" onclick="JNA(false,'+f.istDep+')"><span class="jicon">❌</span>Nein</button>'+
      '</div>';
    h+='<div class="qfb" id="qfb"></div>';
    h+='<button class="qnext" id="qnext" onclick="QN()">Nächste Frage</button>';
    body.innerHTML=h;
  }
  window.JNA=function(gew,istDep){
    document.getElementById('jja').setAttribute('disabled','true');
    document.getElementById('jnein').setAttribute('disabled','true');
    var ok=(gew===istDep);
    if(ok) richtig++;
    var jaBtn=document.getElementById('jja');
    var neinBtn=document.getElementById('jnein');
    if(istDep){ jaBtn.classList.add('correct'); if(!ok) neinBtn.classList.add('wrong'); }
    else { neinBtn.classList.add('correct'); if(!ok) jaBtn.classList.add('wrong'); }
    var fb=document.getElementById('qfb');
    fb.textContent=ok?'Richtig!':(istDep?'Falsch! Dieses Wort IST ein Deponens.':'Falsch! Dieses Wort ist KEIN Deponens.');
    fb.className='qfb show '+(ok?'ok':'err');
    document.getElementById('qnext').className='qnext show';
  };
  window.QN=function(){cur++;zeige();};
  function ergebnis(){
    var pct=Math.round((richtig/fragen.length)*100);
    var msg=pct===100?'Perfekt! Alle richtig!':pct>=80?'Sehr gut!':pct>=60?'Gut gemacht!':pct>=40?'Weiter üben!':'Nochmal von vorne!';
    body.innerHTML='<div class="result-box"><span class="result-trophy">'+(pct===100?'🏆':pct>=80?'⭐':'📚')+'</span><div class="result-score">'+richtig+' / '+fragen.length+'</div>'+
      '<div class="result-sub">richtig beantwortet</div><div class="result-msg">'+msg+' ('+pct+'%)</div>'+
      '<button class="result-retry" onclick="('+retryFn+')()">Nochmal versuchen</button></div>';
  }
  zeige();
}

  for(var i=0;i<BEREICHE.length;i++){
    var b=BEREICHE[i];
    h+='<div class="card" onclick="goKapitelAuswahl(\''+b.id+'\')"><div class="ci">'+b.icon+'</div><div class="ct">'+b.label+'</div><div class="cd">'+b.desc+'</div></div>';
  }
  document.getElementById('bereich-grid').innerHTML=h;
  showView('v-bereich');
  setBc([{l:'Startseite',fn:'goHome()'},{l:S.sa.title,fn:"goModus('"+S.sa.id+"')"},{l:ml,fn:"goBereich('"+modus+"')"}]);
}
function goKapitelAuswahl(bereichId){
  var bObj=null;
  for(var i=0;i<BEREICHE.length;i++){if(BEREICHE[i].id===bereichId){bObj=BEREICHE[i];break;}}
  S.bereich=bObj;
  var ml=S.modus==='lernen'?'Lernen':'Quiz';
  document.getElementById('back-kapitel').onclick=function(){goBereich(S.modus);};

  var kaps,useIcon=false;
  if(bereichId==='vokabeln'){
    kaps=VOK_KAPITEL;
  } else if(bereichId==='grammatik'){
    kaps=GRAMMATIK_KAPITEL; useIcon=true;
  } else if(bereichId==='itext'){
    kaps=ITEXT_KAPITEL; useIcon=true;
  } else {
    // T-Text: Platzhalter
    document.getElementById('inhalt-title').textContent=S.sa.title+' – T-Text';
    document.getElementById('inhalt-sub').textContent=S.modus==='lernen'?'Lernmodus':'Quizmodus';
    document.getElementById('back-inhalt').onclick=function(){goBereich(S.modus);};
    document.getElementById('inhalt-body').innerHTML='<div class="ph"><div class="phi">📬</div><p>T-Text wird bald hinzugefuegt.<br>Schick mir den Inhalt!</p></div>';
    showView('v-inhalt');
    setBc([{l:'Startseite',fn:'goHome()'},{l:S.sa.title,fn:"goModus('"+S.sa.id+"')"},{l:ml,fn:"goBereich('"+S.modus+"')"},{l:'T-Text',fn:"goKapitelAuswahl('ttext')"}]);
    return;
  }

  document.getElementById('kapitel-title').textContent=S.sa.title+' – '+bObj.label+' – '+ml;
  document.getElementById('kapitel-sub').textContent='Welches Thema?';
  var h='';
  for(var j=0;j<kaps.length;j++){
    var k=kaps[j];
    if(useIcon){
      h+='<div class="card" onclick="goInhalt(\''+k.id+'\')"><div class="ci">'+(k.icon||'📖')+'</div><div class="ct" style="font-size:.82rem">'+k.label+'</div></div>';
    } else {
      h+='<div class="kapcard" onclick="goInhalt(\''+k.id+'\')"><div class="kn">'+k.id+'</div><div class="kl">'+k.anzahl+' Einträge</div></div>';
    }
  }
  document.getElementById('kapitel-grid').innerHTML=h;
  showView('v-kapitel');
  setBc([{l:'Startseite',fn:'goHome()'},{l:S.sa.title,fn:"goModus('"+S.sa.id+"')"},{l:ml,fn:"goBereich('"+S.modus+"')"},{l:bObj.label,fn:"goKapitelAuswahl('"+bereichId+"')"}]);
}

function goInhalt(kapId){
  S.kapitel=kapId;
  var ml=S.modus==='lernen'?'Lernen':'Quiz';
  var body=document.getElementById('inhalt-body');
  body.innerHTML='';
  var titel='',untertitel='';

  if(S.bereich.id==='vokabeln'){
    titel='Wörter '+kapId;
    untertitel=S.modus==='lernen'?'Klicke auf die rechte Spalte, um die Bedeutung aufzudecken.':'Wähle die richtige Bedeutung aus.';
  } else if(S.bereich.id==='itext'){
    var iname=ITEXT_KAPITEL; for(var i=0;i<iname.length;i++){if(iname[i].id===kapId){titel=iname[i].label;break;}}
    untertitel=S.modus==='lernen'?'Lernmodus':'Quizmodus';
  } else if(S.bereich.id==='grammatik'){
    var gname=GRAMMATIK_KAPITEL; for(var gi=0;gi<gname.length;gi++){if(gname[gi].id===kapId){titel=gname[gi].label;break;}}
    untertitel=S.modus==='lernen'?'Lernmodus':'Quizmodus';
  }

  document.getElementById('inhalt-title').textContent=titel;
  document.getElementById('inhalt-sub').textContent=untertitel;
  document.getElementById('back-inhalt').onclick=function(){goKapitelAuswahl(S.bereich.id);};

  var retryStr='function(){goInhalt("'+kapId+'")}';

  if(S.modus==='lernen'){
    if(S.bereich.id==='vokabeln'){
      renderVokLearn(kapId,body);
    } else if(S.bereich.id==='itext'){
      renderITextLearn(kapId,body);
    } else if(S.bereich.id==='grammatik'){
      renderGrammatikLearn(kapId,body);
    }
  } else {
    var daten;
    if(S.bereich.id==='vokabeln'){
      daten=makeVokQuiz(kapId);
    } else if(S.bereich.id==='itext'){
      var iq=makeITextQuiz(kapId);
      daten={typ:'mc',fragen:iq};
    } else if(S.bereich.id==='grammatik'){
      daten=makeGrammatikQuiz(kapId);
    }
    renderQuizEngine(body,daten,retryStr);
  }

  showView('v-inhalt');
  setBc([
    {l:'Startseite',fn:'goHome()'},
    {l:S.sa.title,fn:"goModus('"+S.sa.id+"')"},
    {l:ml,fn:"goBereich('"+S.modus+"')"},
    {l:S.bereich.label,fn:"goKapitelAuswahl('"+S.bereich.id+"')"},
    {l:titel||kapId,fn:"goInhalt('"+kapId+"')"}
  ]);
}

function renderVokLearn(kapId,body){
  var items=VOK_DATEN[kapId];
  var h='<p class="vok-hint">Tippe auf die rechte Spalte, um die Bedeutung aufzudecken.</p>';
  h+='<div class="vok-grid"><div class="vok-head"><div class="vh">Latein</div><div class="vh">Deutsch</div></div>';
  for(var i=0;i<items.length;i++){
    h+='<div class="vok-row"><div class="vok-lat">'+items[i][0]+'</div>';
    h+='<div class="vok-de" onclick="this.classList.toggle(\'rev\')"><span class="hde">'+items[i][1]+'</span><span class="taphi">👆</span></div></div>';
  }
  h+='</div>';
  body.innerHTML=h;
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init(){
  var g=document.getElementById('sa-grid'),h='';
  for(var i=0;i<SCHULAUFGABEN.length;i++){
    var s=SCHULAUFGABEN[i];
    h+='<div class="card" onclick="goModus(\''+s.id+'\')"><div class="ci">'+s.icon+'</div><div class="ct">'+s.title+'</div><div class="cd">'+s.desc+'</div></div>';
  }
  g.innerHTML=h;
  setBc([{l:'Startseite',fn:'goHome()'}]);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
</script>
